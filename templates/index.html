<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Metadata Scraper</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container py-4">
    <!-- Header -->
    <header class="text-center mb-4">
      <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
        <i class="bi bi-youtube text-danger" style="font-size:2.2rem"></i>
        <h1 class="mb-0 fw-bold">YouTube Metadata Scraper</h1>
      </div>
      <p class="text-muted">
        Paste YouTube links below, scrape metadata, and export to Excel.
      </p>
    </header>

    <!-- Input Area -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <label for="urlInput" class="form-label fw-semibold">
          <i class="bi bi-link-45deg"></i> YouTube Links
          <small class="text-muted fw-normal">(one per line)</small>
        </label>
        <textarea
          id="urlInput"
          class="form-control"
          rows="6"
          placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ&#10;https://youtu.be/jNQXAC9IVRw&#10;https://www.youtube.com/watch?v=9bZkp7q19f0"
        ></textarea>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <small id="linkCount" class="text-muted">0 links entered</small>
          <div class="d-flex gap-2">
            <button id="clearBtn" class="btn btn-outline-secondary btn-sm" disabled>
              <i class="bi bi-x-circle"></i> Clear
            </button>
            <button id="scrapeBtn" class="btn btn-danger" disabled>
              <i class="bi bi-search"></i> Scrape Metadata
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Progress -->
    <div id="progressSection" class="mb-4 d-none">
      <div class="progress" style="height: 24px">
        <div
          id="progressBar"
          class="progress-bar progress-bar-striped progress-bar-animated bg-danger"
          role="progressbar"
          style="width: 0%"
        >
          0%
        </div>
      </div>
      <small id="progressText" class="text-muted mt-1 d-block">Processing…</small>
    </div>

    <!-- Results -->
    <div id="resultsSection" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0"><i class="bi bi-table"></i> Results</h5>
        <button id="exportBtn" class="btn btn-success">
          <i class="bi bi-file-earmark-excel"></i> Export to Excel
        </button>
      </div>
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle" id="resultsTable">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Channel</th>
              <th>Link</th>
              <th>Title</th>
              <th>Views</th>
              <th>Likes</th>
              <th>Comments</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Toast container for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
