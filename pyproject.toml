[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkyoutube"
version = "0.1.0"
description = "A YouTube-inspired CLI that prints metadata for any YouTube video."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "lofi48203-gif" }]
keywords = ["youtube", "cli", "video", "metadata", "yt-dlp", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
checkyoutube = "checkyoutube.cli:main"

[project.urls]
Homepage = "https://github.com/lofi48203-gif/hoho"
Repository = "https://github.com/lofi48203-gif/hoho"
Issues = "https://github.com/lofi48203-gif/hoho/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/checkyoutube"]

[tool.hatch.build.targets.sdist]
include = [
    "src/checkyoutube",
    "README.md",
    "LICENSE",
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line-too-long; ruff format handles wrapping where it can
]

[tool.ruff.lint.isort]
known-first-party = ["checkyoutube"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["checkyoutube"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
